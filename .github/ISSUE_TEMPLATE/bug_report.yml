name: Bug report
description: Report reproducible behavior that is not working as expected.
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Chief. Remove private data before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest reliable sequence of steps.
      placeholder: |
        1. Open...
        2. Select...
        3. See...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chief version or commit
      placeholder: 0.1.0 or commit SHA
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Web
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant logs or screenshots without credentials or personal data.
