[package]
name = "chief-browser-relay"
version = "0.1.0"
edition = "2021"
description = "Streams one isolated browser session's screen (H.264) and sound (Opus) to its viewers."
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

# Capture is X11 and sound is PulseAudio (PipeWire), so the relay is Linux-only.
# x264 and Opus are built from vendor/ by build.rs.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes"] }
libc = "0.2"
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
pulseaudio = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
