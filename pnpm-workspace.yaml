packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

useNodeVersion: 24.14.0
nodeVersion: 24.14.0
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true

catalog:
  "@types/node": ^24.13.0
  "@types/react": ^19.1.8
  "@types/react-dom": ^19.1.6
  eslint: ^9.38.0
  prettier: ^3.6.2
  typescript: ^5.9.3
  zod: ^4.4.3

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - "prettier-plugin-tailwindcss"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp

overrides:
  "better-auth>zod": 4.3.6

packageExtensions:
  "drizzle-kit@1.0.0-rc.4":
    peerDependencies:
      drizzle-orm: 1.0.0-rc.4

patchedDependencies:
  "@browser-ui/react@0.2.0": patches/@browser-ui__react@0.2.0.patch
