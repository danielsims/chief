name: chief

x-relay-environment: &relay-environment
  ACCOUNT_IDENTITY_MODE: chief-account
  AUTH_BASE_URL: ${CHIEF_PUBLIC_URL:?Set CHIEF_PUBLIC_URL in deploy/self-host/.env}
  AUTH_GOOGLE_REDIRECT_URI: ${CHIEF_PUBLIC_URL}/api/auth/callback/google
  AUTH_UI_ORIGIN: ${CHIEF_PUBLIC_URL}
  BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
  BOOTSTRAP_TOKEN_SHA256_FILE: /run/secrets/bootstrap_token_sha256
  CHIEF_LOG_LEVEL: ${CHIEF_LOG_LEVEL:-info}
  CHIEF_STATE_DIR: /var/lib/chief
  CLOUDFLARE_CF_FETCH_ENABLED: "false"
  COMPUTER_AUTH_SECRET_FILE: /run/secrets/computer_auth_secret
  RELAY_SECRET_KEY_FILE: /run/secrets/relay_secret_key
  RELAY_ID_FILE: /run/secrets/relay_id
  COMPUTER_BASE_URL: http://computer:8080
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Chief}
  MINIFLARE_CACHE_DIR: /run/chief/miniflare
  # This label is query metadata, not a data-isolation boundary. The bundled
  # collector remains local to this Compose stack.
  RELAY_DEPLOYMENT: ${RELAY_DEPLOYMENT:-local}
  RELAY_OTLP_ENDPOINT: ${RELAY_OTLP_ENDPOINT:-}
  RELAY_TELEMETRY_INCLUDE_CONTENT: ${RELAY_TELEMETRY_INCLUDE_CONTENT:-false}
  RELAY_TELEMETRY_MODE: ${RELAY_TELEMETRY_MODE:-errors}
  XDG_CONFIG_HOME: /run/chief/config

x-relay-secrets: &relay-secrets
  - better_auth_secret
  - bootstrap_token_sha256
  - computer_auth_secret
  - relay_secret_key
  - relay_id
  - google_client_secret

x-service-security: &service-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-service-logging: &service-logging
  driver: local
  options:
    max-file: "5"
    max-size: 10m

services:
  observability:
    image: grafana/otel-lgtm:0.31.0
    profiles: ["observability"]
    ports:
      - "${CHIEF_OBSERVABILITY_PORT:-3000}:3000"
      - "${CHIEF_OTLP_HTTP_PORT:-14318}:4318"
    volumes:
      - observability-data:/data
      - ./grafana/chief-agent-observability.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/chief-agent-observability.yaml:ro
      - ./grafana/dashboards/chief:/otel-lgtm/grafana/dashboards/chief:ro
      - ./grafana/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
    networks:
      - edge
    restart: unless-stopped
    <<: *service-security
    logging: *service-logging

  computer:
    build:
      context: ../..
      dockerfile: apps/executor/Dockerfile
    image: ${CHIEF_COMPUTER_IMAGE:-chief-computer:local}
    environment:
      COMPUTER_AUTH_SECRET_FILE: /run/secrets/computer_auth_secret
      COMPUTER_BROWSER_ENCRYPTION_KEY_FILE: /run/secrets/computer_browser_encryption_key
      COMPUTER_BROWSER_STREAM_SECRET_FILE: /run/secrets/computer_browser_stream_secret
      COMPUTER_PUBLIC_URL: ${CHIEF_COMPUTER_PUBLIC_URL:-http://localhost:8788}
      EXECUTOR_AUTH_AUDIENCE: chief-computer
      EXECUTOR_AUTH_ISSUER: https://relay.internal
      XDG_CACHE_HOME: /computers/.cache
    ports:
      - "127.0.0.1:${CHIEF_COMPUTER_PORT:-8788}:8080"
    secrets:
      - computer_auth_secret
      - computer_browser_encryption_key
      - computer_browser_stream_secret
    volumes:
      - computer-data:/computers
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - edge
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    <<: *service-security
    logging: *service-logging

  relay-migrate:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    image: ${CHIEF_RELAY_IMAGE:-relay:local}
    command: ["migrate"]
    environment: *relay-environment
    secrets: *relay-secrets
    volumes:
      - relay-data:/var/lib/chief
    tmpfs:
      - /app/apps/relay/.wrangler:uid=10001,gid=10001,mode=0700
      - /run/chief:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - backend
    restart: "no"
    <<: *service-security
    logging: *service-logging

  relay:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    image: ${CHIEF_RELAY_IMAGE:-relay:local}
    command: ["serve"]
    environment: *relay-environment
    secrets: *relay-secrets
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
    volumes:
      - relay-data:/var/lib/chief
    tmpfs:
      - /app/apps/relay/.wrangler:uid=10001,gid=10001,mode=0700
      - /run/chief:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - backend
      - edge
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    <<: *service-security
    logging: *service-logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: ${CHIEF_WEB_IMAGE:-chief-web:local}
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /app/apps/web/.next/cache:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    <<: *service-security
    logging: *service-logging

  gateway:
    image: caddy:2.10.2-alpine
    environment:
      CHIEF_SITE_ADDRESS: ${CHIEF_SITE_ADDRESS:-http://localhost}
    depends_on:
      relay:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${CHIEF_HTTP_PORT:-8080}:80"
      - "${CHIEF_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    networks:
      - backend
      - edge
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    <<: *service-security
    logging: *service-logging

  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["tunnel"]
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      gateway:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    <<: *service-security
    logging: *service-logging

networks:
  backend:
    internal: true
  edge:

volumes:
  computer-data:
  observability-data:
  relay-data:
  gateway-data:
  gateway-config:

secrets:
  better_auth_secret:
    file: ./secrets/better_auth_secret
  bootstrap_token_sha256:
    file: ./secrets/bootstrap_token_sha256
  google_client_secret:
    file: ./secrets/google_client_secret
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
  computer_auth_secret:
    file: ./secrets/computer_auth_secret
  relay_secret_key:
    file: ./secrets/relay_secret_key
  relay_id:
    file: ./secrets/relay_id
  computer_browser_encryption_key:
    file: ./secrets/computer_browser_encryption_key
  computer_browser_stream_secret:
    file: ./secrets/computer_browser_stream_secret
